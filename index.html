<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Hush</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 56px 22px 40px; position: relative; }
  .glow { position: absolute; left: 50%; top: 0; width: 340px; height: 260px; margin-left: -170px; background: radial-gradient(#8B7CFF55, transparent 70%); z-index: 0; pointer-events: none; }
  .logo { position: relative; width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 18px; background: linear-gradient(135deg, #8B7CFF, #FF6B9E); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; }
  h1 { position: relative; margin: 0; font-size: 34px; }
  p { position: relative; color: #9a9aa5; margin: 8px 0 26px; }
  .btn { position: relative; display: block; padding: 15px; border-radius: 50px; background: linear-gradient(90deg, #8B7CFF, #FF6B9E); font-weight: 700; text-decoration: none; color: #fff; }
  .btn.off { opacity: .45; pointer-events: none; }
  .v { position: relative; color: #6f6f7a; font-size: 12px; margin-top: 10px; min-height: 16px; }
  .card { position: relative; text-align: left; margin-top: 30px; padding: 18px; border-radius: 22px; background: #121214; border: 1px solid #232328; }
  .card b { display: block; margin-bottom: 8px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { color: #c9c9d0; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="logo">H</div>
  <h1>Hush</h1>
  <p>Private chat, just for you two.</p>
  <a id="dl" class="btn off" href="#">Download for Android</a>
  <div id="ver" class="v"></div>

  <div class="card">
    <b>What's new</b>
    <ul id="notes"><li>Loading...</li></ul>
  </div>

  <div class="card">
    <b>How to install</b>
    <ul>
      <li>Download the file</li>
      <li>Open it and allow "Install unknown apps"</li>
      <li>Tap Install</li>
    </ul>
  </div>
</div>
<script>
  // everything on this page comes from version.json, the same file the app checks for updates
  fetch("version.json?t=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (v) {
      var dl = document.getElementById("dl");
      if (v.apk) { dl.href = v.apk; dl.classList.remove("off"); }
      var parts = [];
      if (v.versionName) parts.push("Version " + v.versionName);
      if (v.size) parts.push(v.size);
      document.getElementById("ver").textContent = parts.join(" · ");
      var ul = document.getElementById("notes");
      ul.innerHTML = "";
      (v.notes || []).forEach(function (n) {
        var li = document.createElement("li");
        li.textContent = n;
        ul.appendChild(li);
      });
    })
    .catch(function () {
      document.getElementById("notes").innerHTML = "<li>Could not load the latest version.</li>";
    });
</script>
</body>
</html>
